name: GitHub每日热榜TOP5
on:
  schedule:
    # cron是UTC时间，国内早上8点 = UTC 0点
    - cron: "0 0 * * *"
  workflow_dispatch: # 支持手动点按钮立刻测试

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install requests
      - name: 执行脚本
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python trending.py
